spring.application.name=incident-management
server.port=8090

# Banco H2 em arquivo (os dados persistem entre execuções na pasta ./data)
spring.datasource.url=jdbc:h2:file:./data/incidentdb;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Upload da foto do aluno
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# JWT
api.security.token.secret=${JWT_SECRET:cp6-incident-management-secret-key}
api.security.token.expiration-hours=2

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
